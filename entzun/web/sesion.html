<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"> <!-- acentos -->
<meta name="viewport" content="width=device-width, initial-scale=1"> <!-- adaptable al móvil -->
<meta name="robots" content="noindex">
<title>Sesión · ENTZUN</title> <!-- se completa con la sesión -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="web.css?v=20261123w">
<script src="../shared/entzun-logo.js?v=20261123w"></script><script src="../shared/entzun-sistema.js?v=20261123w"></script><script src="web.js?v=20261123w"></script>
<style>
  /* ---------- Cabecera de la sesión: título, hilo y la noche como línea ---------- */
  .ses-top { padding-block: clamp(48px, 7vw, 104px) clamp(40px, 5vw, 72px); }
  .ses-top h1 { font-size: clamp(40px, 5.2vw, 76px); margin-top: 14px; max-width: 14ch; }
  .ses-datos { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 28px clamp(32px, 6vw, 96px); align-items: end; margin-bottom: clamp(44px, 6vw, 84px); }
  .ses-top h1.t-logo { margin-top: calc(18px - .3em); }
  .texto { font-size: var(--t-l); line-height: 1.45; color: var(--blanco); }
  /* ---------- Los dos discos, uno frente al otro ---------- */
  .discos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 44px clamp(28px, 4vw, 64px); }
  .disco h2 { font-size: var(--t-xl); margin-top: 10px; }
  .disco .alb { color: var(--gris); margin-top: 4px; } .disco .desc { margin-top: 18px; color: var(--gris); }
  .caras { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 26px; font-size: var(--t-s); }
  .caras ol { margin-top: 8px; padding-left: 1.6em; color: var(--gris); } .caras li { padding: 2px 0; }
  /* ---------- El horario ---------- */
  .noche { list-style: none; border-top: 1px solid var(--linea); }
  .noche li { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--linea); align-items: baseline; }
  .noche li span:first-child { color: var(--gris); } .noche b { font-weight: 500; }
  /* ---------- Reservar ---------- */
  .opciones { list-style: none; border-top: 1px solid var(--linea); margin-bottom: 28px; }
  .opciones li { display: flex; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--linea); }
  .botones { display: flex; gap: 12px 22px; flex-wrap: wrap; align-items: center; }
  .aviso { color: var(--gris); font-size: var(--t-s); margin-top: 20px; }
  .barra { display: none; }                                                 /* la reserva a mano, solo en el móvil */
  @media (max-width: 760px) {
    .ses-datos, .discos { grid-template-columns: minmax(0, 1fr); }
    .noche li { grid-template-columns: minmax(0, 1fr); gap: 4px; }
    .barra { display: block; position: sticky; bottom: 0; z-index: 5; background: var(--negro); border-top: 1px solid var(--linea); padding: 12px 0; }
    .barra .btn { width: 100%; justify-content: center; background: var(--blanco); color: var(--negro); }
  }
</style>
</head>
<body>
<main id="contenido" class="wrap"><article id="ficha"></article></main>
<script>
cabecera(""); pie();                                                       // cabecera y pie comunes
const n = +new URLSearchParams(location.search).get("n") || 24;           // qué sesión enseñar
const p = sesion(n) || PROGRAMA[0], a = disco(p[5]), b = disco(p[6]), h = horario(p); // la sesión, sus discos y sus horas
document.title = `Sesión ${nn(p[0])} · ${p[3]} · ENTZUN`;                  // título de la pestaña
const lista = (id) => CANCIONES[id] ? `<div class="caras"><div><ol>${CANCIONES[id][0].map((c) => `<li>${c}</li>`).join("")}</ol></div>
  <div><ol start="${CANCIONES[id][0].length + 1}">${CANCIONES[id][1].map((c) => `<li>${c}</li>`).join("")}</ol></div></div>` : ""; // canciones, si las tenemos
const fichaDisco = (l, d) => `<div class="disco"><p class="k gris">Disco ${l}</p><h2>${d[1]}</h2><p class="alb">${d[2]} · ${d[3]} · ${d[4]} min</p>
  <p class="desc">${TEXTOS[d[0]] || ""}</p>${lista(d[0])}</div>`;          // la ficha de un disco
const fila = (txt, libres) => { const e = estado(libres); return `<li><span>${txt}</span><span class="k plazas ${e.cls}">${e.txt}</span></li>`; }; // una opción con sus sitios
const hayCompleta = libresCompleta(p) > 0, hayAlgo = p[7] > 0 || p[8] > 0;  // qué se puede reservar
document.getElementById("ficha").innerHTML = `
  <header class="ses-top">
    <div class="ses-datos">
      <div><p class="k gris">Nº ${nn(p[0])} · ${fechaLarga(p[1])} · ${h.iniA}–${h.finB}</p><h1 class="t-logo grande">${p[3]}</h1></div>
      <p class="texto">${p[4]}</p>
    </div>
    ${nocheHTML(p)}
  </header>
  <section class="bloque sec"><p class="k rotulo">Los discos</p><div class="discos">${fichaDisco("A", a)}${fichaDisco("B", b)}</div></section>
  <section class="bloque sec"><p class="k rotulo">La sesión</p><ol class="noche">
    <li><span class="k">${sumaHora(p[2], -30)}</span><span><b>Apertura de puertas.</b> Barra abierta y los dos discos de la noche, a la vista.</span></li>
    <li><span class="k">${h.iniA}–${h.finA}</span><span><b>Disco A.</b> ${a[1]}, entero y en silencio.</span></li>
    <li><span class="k">${h.finA}–${h.iniB}</span><span><b>Descanso · ${DESCANSO} minutos.</b> Luz, barra y conversación. Quien viene a un solo disco entra o sale aquí.</span></li>
    <li><span class="k">${h.iniB}–${h.finB}</span><span><b>Disco B.</b> ${b[1]}, hasta la última canción.</span></li></ol></section>
  <section class="bloque sec"><p class="k rotulo">Reservar</p><div>
    <ul class="opciones">${fila("Sesión completa", libresCompleta(p))}${fila("Solo disco A", p[7])}${fila("Solo disco B", p[8])}</ul>
    <div class="botones">${hayCompleta ? `<a class="btn k" href="reservar.html?n=${p[0]}&modo=completa">Reservar sesión completa</a>` : ""}
      ${hayAlgo ? `<a class="btn linea k" href="reservar.html?n=${p[0]}&modo=uno">Reservar un solo disco</a>` : `<span class="btn k" aria-disabled="true" style="opacity:.35">Completo</span>`}</div>
    <p class="aviso">${AFORO} sitios por sesión. Puedes venir a los dos discos o reservar únicamente uno de ellos.</p></div></section>
  ${hayAlgo ? `<div class="barra"><a class="btn k" href="reservar.html?n=${p[0]}">Reservar sitio</a></div>` : ""}`;
document.querySelectorAll(".t-logo").forEach(ENTZUN.rotula);              // el título de la sesión, con la letra de la marca
</script>
</body>
</html>
