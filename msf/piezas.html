// ---------- Ayudas para crear elementos ----------
function el(g, tag, attrs) {                       // crea un elemento SVG con sus atributos
  const e = document.createElementNS(NS, tag);     // nuevo elemento
  for (const k in attrs) e.setAttribute(k, attrs[k]); // atributos
  g.appendChild(e);                                // lo añadimos
  return e;                                        // y lo devolvemos
}
function txt(g, x, y, s, size, peso = 400, color = GRIS, extra = {}) { // texto suelto
  const t = el(g, "text", { x, y, "font-size": size, "font-weight": peso, fill: color, ...extra });
  t.textContent = s;                               // contenido
  return t;
}
function logo(g, x, y, ancho) {                    // logo alineado a la derecha (x = borde derecho), con su proporción
  const alto = ancho * LOGO[1];                    // alto según la proporción del logo
  el(g, "image", { href: LOGO[0], x: x - ancho, y, width: ancho, height: alto });
}
function conector(g, a, xFin, y, color = NEGRO) {  // línea en codo desde el dibujo hasta una etiqueta
  el(g, "polyline", { points: `${a[0]},${a[1]} ${xFin - 16},${a[1]} ${xFin - 16},${y} ${xFin},${y}`,
    fill: "none", stroke: color, "stroke-width": color === NEGRO ? 1.5 : 2.5 });
  el(g, "circle", { cx: a[0], cy: a[1], r: 6, fill: color }); // puntito sobre el dibujo
}
function lista(g, x, y, items, size, paso, empieza = 1, etiquetas = null, ancho = 0, colorTxt = NEGRO) { // lista numerada: número rojo + texto negro
  const col = ancho || size * 1.25;                              // ancho de la columna de números (cabe el "10")
  items.forEach((s, i) => {
    const yy = y + i * paso;                                      // altura de esta línea
    txt(g, x + col - size * 0.45, yy, etiquetas ? etiquetas[i] : i + empieza, size, 500, ROJO, { "text-anchor": "end" }); // número, alineado a la derecha
    txt(g, x + col, yy, s, size, 400, colorTxt);                  // texto: siempre empieza en la misma x
  });
}

// ---------- La caja isométrica ----------
// o = { S, CX, CY, abierta, kit, numeros (true/false), foco ("hosp" | "bas" | null) }
// Devuelve la función iso para poder colocar conectores
function kit(g, o) {
  const W = 7, D = 5, H = 3;                                  // medidas de la caja
  const iso = (x, y, z) => [o.CX + (x - y) * o.S * 0.866, o.CY + (x + y) * o.S * 0.5 - z * o.S]; // 3D → 2D
  const capa = parte => el(g, "g", { opacity: !o.foco || o.foco === parte ? 1 : 0.18 }); // lo que no está en foco se apaga
  const cara = (gg, pts, fill) => el(gg, "polygon", {         // una cara con contorno negro
    points: pts.map(p => iso(...p).join(",")).join(" "), fill, stroke: NEGRO,
    "stroke-width": Math.max(2, o.S / 16), "stroke-linejoin": "round" });
  const cubo = (gg, x, y, z, w, d, h, c) => {                 // un cubo con sus 3 caras visibles
    cara(gg, [[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]], c[0]); // arriba
    cara(gg, [[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]], c[1]); // frontal izquierda
    cara(gg, [[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]], c[2]); // frontal derecha
  };
  const th = o.abierta ? 130 * Math.PI / 180 : 0;             // ángulo de las solapas
  const solapa = (gg, a, b, dir, L, fill) => {                // una solapa de la tapa
    const v = [dir[0] * Math.cos(th) * L, dir[1] * Math.cos(th) * L, Math.sin(th) * L];
    cara(gg, [a, b, [b[0]+v[0], b[1]+v[1], b[2]+v[2]], [a[0]+v[0], a[1]+v[1], a[2]+v[2]]], fill);
  };
  const sIzq = gg => solapa(gg, [0,0,H],[0,D,H],[1,0],3.5,"#EDEDED");  // solapa izquierda
  const sFon = gg => solapa(gg, [0,0,H],[W,0,H],[0,1],2.5,"#EDEDED");  // solapa del fondo
  const sDer = gg => solapa(gg, [W,0,H],[W,D,H],[-1,0],3.5,"#F5F5F5"); // solapa derecha
  const sFre = gg => solapa(gg, [0,D,H],[W,D,H],[0,-1],2.5,"#FFFFFF"); // solapa frontal

  const atras = capa("caja");                                 // 1) parte de atrás de la caja
  if (o.abierta) { sIzq(atras); sFon(atras); }
  cara(atras, [[0,0,0],[0,D,0],[0,D,H],[0,0,H]], "#E6E6E6");  // pared interior izquierda
  cara(atras, [[0,0,0],[W,0,0],[W,0,H],[0,0,H]], "#EDEDED");  // pared interior del fondo
  cara(atras, [[0,0,0],[W,0,0],[W,D,0],[0,D,0]], "#F5F5F5");  // suelo
  if (o.abierta) {
    const gb = capa("bas");                                   // 2) las 10 unidades básicas (rojas)
    let n = 1;
    for (let f = 0; f < 2; f++) for (let c = 0; c < 5; c++) {
      const x = 0.35 + c * 1.35, y = 1.2 + f * 1.4;           // posición
      cubo(gb, x, y, o.dentro ? 0.05 : 4.6, 1, 1, 0.7, [ROJO, "#B81B19", "#951512"]); // dentro de la caja o flotando
      if (o.numeros) { const p = iso(x + .5, y + .5, 5.3); txt(gb, p[0], p[1] + o.S * .15, n++, o.S * .38, 700, "#fff", { "text-anchor": "middle" }); }
    }
    const gh = capa("hosp");                                  // 3) las 7 unidades de hospital (blancas)
    n = 1;
    for (const [f, k] of [[0, 4], [1, 3]]) for (let c = 0; c < k; c++) {
      const x = 0.6 + c * 1.6 + f * 0.8, y = 0.9 + f * 1.7;   // posición
      cubo(gh, x, y, o.dentro ? 0.8 : 10.1, 1.2, 1.2, 1, ["#FFFFFF", "#F0F0F0", "#DADADA"]); // dentro o flotando
      if (o.numeros) { const p = iso(x + .6, y + .6, 11.1); txt(gh, p[0], p[1] + o.S * .18, n++, o.S * .5, 700, ROJO, { "text-anchor": "middle" }); }
    }
  }
  const delante = capa("caja");                               // 4) parte de delante de la caja
  cara(delante, [[0,D,0],[W,D,0],[W,D,H],[0,D,H]], "#FFFFFF");  // pared frontal izquierda
  cara(delante, [[W,0,0],[W,D,0],[W,D,H],[W,0,H]], "#F5F5F5");  // pared frontal derecha
  if (o.abierta) { sDer(delante); sFre(delante); }            // abiertas: las de delante al final
  else { sIzq(delante); sDer(delante); sFon(delante); sFre(delante); } // cerrada: la tapa encima
  return iso;                                                 // para colocar conectores fuera
}

// ---------- CARTEL A3 (1000 × 1414): la infografía completa, en vertical ----------
function cartel(t) {
  const g = document.getElementById("cartel"); g.innerHTML = "";
  logo(g, 930, 70, LOGO === LOGOS.en ? 240 : 170);           // logo arriba a la derecha (el inglés es más ancho)
  txt(g, 70, 134, t.cabe[0], 80, 500, NEGRO);                 // titular en peso medio, como msf.es (alineado con lo alto del logo)
  txt(g, 70, 216, t.cabe[1], 80, 500, ROJO);                  // titular, parte roja
  txt(g, 70, 272, t.entrada[0], 24, 400, GRIS);               // entradilla
  txt(g, 70, 304, t.entrada[1], 24, 700, NEGRO);              // entradilla, lo importante
  const iso = kit(g, { S: 34, CX: 300, CY: 840, abierta: true, numeros: true, kit: t.kit }); // la caja con números
  const LX = 610;                                             // columna de las etiquetas
  // Hospital
  conector(g, iso(6.6, 1.5, 10.6), LX - 14, 392);
  txt(g, LX, 400, t.hospT, 26, 500, NEGRO);
  txt(g, LX, 428, t.hospS, 18, 400, GRIS);
  lista(g, LX, 460, t.hosp, 18, 24);
  // Básicas
  conector(g, iso(6.75, 1.7, 4.95), LX - 14, 672);
  txt(g, LX, 680, t.basT, 26, 500, NEGRO);
  txt(g, LX, 708, t.basS, 18, 400, GRIS);
  txt(g, LX, 732, t.basCuenta, 18, 700, NEGRO);              // en palabras sencillas: cuadra con el 10.000
  lista(g, LX, 766, t.bas, 18, 24);
  // El kit
  conector(g, iso(7, 2, 1.25), LX - 14, 1032);
  txt(g, LX, 1040, t.kitT, 26, 500, NEGRO);
  txt(g, LX, 1068, t.kitS[0], 18, 400, GRIS);
  txt(g, LX, 1092, t.kitS[1], 18, 400, GRIS);
  // Cifras
  el(g, "line", { x1: 70, y1: 1150, x2: 930, y2: 1150, stroke: NEGRO, "stroke-width": 2 });
  t.cifras.forEach(([n, l1, l2], i) => {
    const x = [70, 440, 690][i];                              // columnas, con más aire entre cifras
    txt(g, x, 1236, n, 62, 500, ROJO);                        // la cifra
    txt(g, x, 1272, l1, 20, 500, NEGRO);                      // palabra clave (negrita)
    txt(g, x, 1298, l2, 19, 400, GRIS);                       // el resto
  });
  txt(g, 70, 1360, t.fuente, 12, 400, GRIS_C);                // fuente
  txt(g, 70, 1380, t.firma, 12, 700, GRIS);                   // aviso + firma
}

// Caja cerrada en línea blanca (detalle pequeño encima de la foto)
function cajaLinea(g, CX, CY, S) {
  const W = 7, D = 5, H = 3;                                  // medidas de la caja
  const iso = (x, y, z) => [CX + (x - y) * S * 0.866, CY + (x + y) * S * 0.5 - z * S]; // 3D → 2D
  const cara = pts => el(g, "polygon", { points: pts.map(p => iso(...p).join(",")).join(" "),
    fill: "rgba(255,255,255,0.08)", stroke: BLANCO, "stroke-width": 3, "stroke-linejoin": "round" });
  cara([[0,0,H],[W,0,H],[W,D,H],[0,D,H]]);                    // tapa
  cara([[0,D,0],[W,D,0],[W,D,H],[0,D,H]]);                    // frontal izquierda
  cara([[W,0,0],[W,D,0],[W,D,H],[W,0,H]]);                    // frontal derecha
  const a = iso(0, D / 2, H), b = iso(W, D / 2, H);           // la junta de las solapas
  el(g, "line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: BLANCO, "stroke-width": 3 });
}

function fondo(g, n, rojo, velo = 0) {                        // foto + velo (velo = capa negra extra, 0–1)
  const id = "sombra" + n;                                    // degradado propio de esta diapositiva
  const defs = el(g, "defs", {});
  const lg = el(defs, "linearGradient", { id, x1: 0, y1: 0, x2: 0, y2: 1 });
  el(lg, "stop", { offset: "0.35", "stop-color": "#000", "stop-opacity": 0 });   // arriba: foto limpia
  el(lg, "stop", { offset: "1", "stop-color": "#000", "stop-opacity": 0.85 });   // abajo: oscuro para el texto
  if (FOTOS[n - 1]) el(g, "image", { href: FOTOS[n - 1], x: 0, y: 0, width: 1080, height: 1350, preserveAspectRatio: "xMidYMid slice" });
  else {                                                      // sin foto todavía: hueco gris con su número
    el(g, "rect", { x: 0, y: 0, width: 1080, height: 1350, fill: "#7a7a7a" });
    txt(g, 540, 420, `Foto ${n} · IA`, 44, 700, "rgba(255,255,255,.55)", { "text-anchor": "middle" });
    txt(g, 540, 470, `prompts-fotos.md`, 28, 400, "rgba(255,255,255,.45)", { "text-anchor": "middle" });
  }
  if (rojo) el(g, "rect", { x: 0, y: 0, width: 1080, height: 1350, fill: ROJO, opacity: 0.55, style: "mix-blend-mode: multiply" }); // velo rojo
  if (velo) el(g, "rect", { x: 0, y: 0, width: 1080, height: 1350, fill: "#000", opacity: velo }); // capa negra extra
  el(g, "rect", { x: 0, y: 0, width: 1080, height: 1350, fill: `url(#${id})` }); // sombra inferior
  const lg2 = el(defs, "linearGradient", { id: id + "a", x1: 0, y1: 0, x2: 0, y2: 1 }); // sombra superior suave
  el(lg2, "stop", { offset: "0", "stop-color": "#000", "stop-opacity": 0.45 });
  el(lg2, "stop", { offset: "1", "stop-color": "#000", "stop-opacity": 0 });
  el(g, "rect", { x: 0, y: 0, width: 1080, height: 240, fill: `url(#${id}a)` }); // para que la firma y el contador se lean
}

// Etiqueta como las de msf.es: negra con chincheta = lugar · roja en mayúsculas = categoría
function etiqueta(g, x, y, s, lugar) {
  const dx = lugar ? 64 : 22;                                 // hueco a la izquierda (para la chincheta)
  const t = txt(g, x + dx, y + 43, lugar ? s : s.toUpperCase(), lugar ? 34 : 30, lugar ? 700 : 500, BLANCO, lugar ? {} : { "letter-spacing": 1 }); // texto
  const w = t.getComputedTextLength() + dx + 24;              // ancho según el texto
  const r = el(g, "rect", { x, y, width: w, height: 62, fill: lugar ? NEGRO : ROJO }); // fondo negro o rojo
  g.insertBefore(r, t);                                       // el fondo, detrás del texto
  if (lugar) {                                                // chincheta blanca (icono de ubicación)
    const cx = x + 36, cy = y + 27;                           // centro de la cabeza de la chincheta
    el(g, "path", { d: `M${cx} ${cy + 20} C${cx - 4} ${cy + 12} ${cx - 12} ${cy + 6} ${cx - 12} ${cy - 2} A12 12 0 1 1 ${cx + 12} ${cy - 2} C${cx + 12} ${cy + 6} ${cx + 4} ${cy + 12} ${cx} ${cy + 20} Z`, fill: BLANCO }); // gota
    el(g, "circle", { cx, cy: cy - 2, r: 4.5, fill: NEGRO }); // agujero
  }
}

// Una línea de titular sobre caja blanca, como los titulares de msf.es sobre foto
function caja(g, x, y, s, size, peso, color) {
  const t = txt(g, x + size * 0.16, y, s, size, peso, color); // el texto (con un poco de margen dentro de la caja)
  const w = t.getComputedTextLength() + size * 0.32;          // ancho de la caja según el texto
  const r = el(g, "rect", { x, y: y - size * 0.98, width: w, height: size * 1.26, fill: BLANCO }); // caja blanca
  g.insertBefore(r, t);                                       // la caja, detrás del texto
}

function diapo(g, n, l, c, op) {                              // composición común a las 5
  fondo(g, n, op.rojo, op.velo);
  txt(g, 80, 100, CAR[l].firma, 18, 400, "rgba(255,255,255,.75)");                 // firma
  txt(g, 1000, 100, `${n}/5`, 30, 500, BLANCO, { "text-anchor": "end" });          // contador
  const size = op.size || 110;                                // tamaño del titular
  const yT = op.yT;                                           // línea base de la 1.ª línea del titular
  etiqueta(g, 80, yT - size - 96, c.tag, op.lugar);           // etiqueta: negra de lugar o roja de categoría
  const paso = size * 1.36;                                   // distancia entre cajas (dejan una franja de foto entre ellas)
  c.t.forEach((s, i) => caja(g, 80, yT + i * paso, s, size, 500, op.rojas && op.rojas.includes(i) ? ROJO : NEGRO)); // titular en cajas blancas
  let yUlt = yT + (c.t.length - 1) * paso;                    // última línea del titular
  let bajo = size * 0.28;                                     // cuánto baja la caja de la última línea
  if (c.t2) { yUlt += bajo + 12 + 60 * 0.98; caja(g, 80, yUlt, c.t2, 60, 300, NEGRO); bajo = 60 * 0.28; } // 2.ª línea, más pequeña y fina
  const ySub = yUlt + bajo + 62;                              // debajo del titular
  c.sub.forEach((s, i) => txt(g, 80, ySub + i * 50, s, 40, i < (c.negritas || 1) ? 500 : 400, BLANCO)); // texto: primeras líneas en peso medio
  const yL = ySub + (c.sub.length - 1) * 50 + 40;             // línea fina abajo
  el(g, "line", { x1: 780, y1: yL, x2: 1000, y2: yL, stroke: BLANCO, "stroke-width": 5 });
  if (op.desliza !== false) txt(g, 1000, 1292, l === "es" ? "Desliza →" : "Swipe →", 34, 500, BLANCO, { "text-anchor": "end" });
}

const SLIDES = [
  (g, t, l) => { diapo(g, 1, l, CAR[l].s[0], { yT: 900, rojo: true, lugar: true, rojas: [1] }); },                                     // la ausencia
  (g, t, l) => { diapo(g, 2, l, CAR[l].s[1], { yT: 760, velo: 0.4, rojas: [1] }); },                                     // la revelación
  (g, t, l) => { diapo(g, 3, l, CAR[l].s[2], { yT: 830, size: 130, velo: 0.4 }); },                                     // atención básica
  (g, t, l) => { diapo(g, 4, l, CAR[l].s[3], { yT: 930, size: 130, velo: 0.4 }); },                                     // atención hospitalaria
  (g, t, l) => { diapo(g, 5, l, CAR[l].s[4], { yT: 640, size: 92, rojo: true, desliza: false, rojas: [2] }); },          // cierre
];

// Una capa de unidades "sacada" de la caja: cubos isométricos numerados (pegatina sobre la foto)
function capa(g, tipo, CX, CY, S) {
  const iso = (x, y, z) => [CX + (x - y) * S * 0.866, CY + (x + y) * S * 0.5 - z * S]; // 3D → 2D
  const cara = (pts, fill) => el(g, "polygon", { points: pts.map(p => iso(...p).join(",")).join(" "), fill,
    stroke: NEGRO, "stroke-width": Math.max(2, S / 16), "stroke-linejoin": "round" });
  const cubo = (x, y, w, h, c, num, colNum) => {                 // un cubo con su número en la tapa
    cara([[x,y,h],[x+w,y,h],[x+w,y+w,h],[x,y+w,h]], c[0]);
    cara([[x,y+w,0],[x+w,y+w,0],[x+w,y+w,h],[x,y+w,h]], c[1]);
    cara([[x+w,y,0],[x+w,y+w,0],[x+w,y+w,h],[x+w,y,h]], c[2]);
    const p = iso(x + w / 2, y + w / 2, h);
    txt(g, p[0], p[1] + S * 0.17, num, S * 0.45, 900, colNum, { "text-anchor": "middle" });
  };
  let n = 1;
  if (tipo === "bas") for (let f = 0; f < 2; f++) for (let c = 0; c < 5; c++) cubo(0.35 + c * 1.35, 1.2 + f * 1.4, 1, 0.7, [ROJO, "#B81B19", "#951512"], n++, "#fff");
  else for (const [f, k] of [[0, 4], [1, 3]]) for (let c = 0; c < k; c++) cubo(0.6 + c * 1.6 + f * 0.8, 0.9 + f * 1.7, 1.2, 1, ["#FFFFFF", "#F0F0F0", "#DADADA"], n++, ROJO);
}

function carrusel(t, l) {
  const c = document.getElementById("carrusel"); c.innerHTML = ""; // vaciamos
  SLIDES.forEach((pintaSlide, i) => {
    const f = document.createElement("figure");               // contenedor de la diapositiva
    f.innerHTML = `<figcaption>${i + 1}/5</figcaption>`;      // nombre
    const s = el(f, "svg", { viewBox: "0 0 1080 1350", width: 300 }); // la diapositiva
    c.appendChild(f);                                         // la añadimos a la galería
    pintaSlide(s, t, l);                                      // y la dibujamos (con su idioma)
  });
}

function story(t) {
  const g = document.getElementById("story"); g.innerHTML = "";
  if (FOTO_STORY) el(g, "image", { href: FOTO_STORY, x: 0, y: 0, width: 1080, height: 1920, preserveAspectRatio: "xMidYMid slice" }); // foto a sangre
  else {
    el(g, "rect", { x: 0, y: 0, width: 1080, height: 1920, fill: "#7a7a7a" });                 // hueco gris
    txt(g, 540, 1840, "Foto story · IA (prompts-fotos.md)", 30, 700, "rgba(255,255,255,.5)", { "text-anchor": "middle" });
  }
  el(g, "rect", { x: 0, y: 0, width: 1080, height: 1920, fill: "#000", opacity: 0.62 });      // velo oscuro: el texto blanco se lee
  caja(g, 80, 340, t.cabe[0], 120, 500, NEGRO);               // titular en cajas blancas, como msf.es
  caja(g, 80, 340 + 120 * 1.36, t.cabe[1], 120, 500, ROJO);
  const iso = kit(g, { S: 38, CX: 318, CY: 1050, abierta: true, numeros: true }); // caja numerada
  const LX = 640, B = "#fff";                                 // columna de las listas · blanco
  conector(g, iso(6.6, 1.5, 10.6), LX - 16, 585, B);          // de la capa de hospital a su lista
  txt(g, LX, 593, t.hospT, 32, 500, B);
  txt(g, LX, 635, t.hospS, 23, 400, "rgba(255,255,255,.8)");
  lista(g, LX, 685, t.hosp, 30, 42, 1, null, 0, B);
  conector(g, iso(6.75, 1.7, 4.95), LX - 16, 999, B);         // de la capa básica a su lista
  txt(g, LX, 1007, t.basT, 32, 500, B);
  txt(g, LX, 1047, t.basS, 23, 400, "rgba(255,255,255,.8)");
  lista(g, LX, 1091, t.bas, 30, 35, 1, null, 0, B);
  caja(g, 80, 1600, t.cifras[0][0], 150, 500, ROJO);          // 10.000 en rojo sobre caja blanca, con aire por encima
  caja(g, 80, 1600 + 150 * 0.28 + 12 + 46 * 0.98, t.personas, 46, 300, NEGRO); // la frase, en fino debajo
  txt(g, 80, 1770, CAR[document.documentElement.lang === "en" ? "en" : "es"].firma, 18, 400, "rgba(255,255,255,.7)"); // firma
}

// ---------- Pintar todo en un idioma ----------
function pintar(l) {
  const t = T[l];                                             // textos del idioma
  LOGO = LOGOS[l];                                            // logo del idioma
  document.documentElement.lang = l;                          // idioma de la página
  ROJO = "#D7211E"; cartel(t);                                // el cartel impreso, con el rojo del manual
  ROJO = "#EE0000"; carrusel(t, l); story(t);                 // lo digital, con el rojo de msf.es                           // todas las piezas
  document.querySelectorAll(".idioma button").forEach(b => b.classList.toggle("on", b.dataset.l === l)); // botón activo
}
document.querySelectorAll(".idioma button").forEach(b => b.onclick = () => pintar(b.dataset.l)); // cambiar idioma
document.fonts.ready.then(() => pintar("es"));                // pintamos cuando la tipografía ha cargado
</script>
