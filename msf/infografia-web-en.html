<!-- Inter Tight: sustituto gratuito de Atlas Grotesk (la de MSF tiene licencia) -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* Fondo gris alrededor para que se vea el marco blanco de la pieza */
  body { margin: 0; background: #d9d9d9; display: grid; place-items: center; min-height: 100vh; font-family: "Inter Tight", Arial, sans-serif; }
  /* Contenedor relativo: el tooltip se posiciona dentro */
  .pieza { position: relative; width: min(96vw, 1280px); }
  /* La pieza: formato horizontal 16:9 (1600 × 900) */
  svg { display: block; width: 100%; height: auto; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.15); }
  /* Todos los textos con la tipografía sustituta */
  text { font-family: "Inter Tight", Arial, sans-serif; }
  /* Botón y elementos interactivos: cursor de mano */
  #boton, [data-u] { cursor: pointer; }
  /* Quitar el contorno azul del foco y poner uno rojo de marca */
  #boton:focus { outline: none; }
  #boton:focus-visible rect { stroke: #000; stroke-width: 3; }
  .item:focus { outline: none; }
  /* Ítem de la lista resaltado (al pasar por encima su cubo) */
  .item.activo text { fill: #EE0000; font-weight: 700; }
  /* Etiquetas: aparecen con un fundido */
  #etiquetas { transition: opacity .4s; }
  /* Tooltip: caja blanca con borde negro, como sus pictogramas */
  .tip { position: absolute; pointer-events: none; background: #fff; border: 2px solid #000; padding: 10px 12px; max-width: 230px;
         font-size: 14px; line-height: 1.3; color: #414141; opacity: 0; transform: translate(-50%, calc(-100% - 14px)); transition: opacity .15s; }
  .tip b { display: block; color: #000; font-size: 15px; margin-bottom: 2px; } /* título del tooltip */
  .tip.visible { opacity: 1; }
  .cambia { transition: opacity .3s; }      /* los textos que cambian se funden */
  .cambia.fuera { opacity: 0; }             /* estado oculto durante el cambio */
  .num-c { transition: fill .6s; }
  #botonTxt { text-transform: uppercase; letter-spacing: .02em; } /* texto del botón en mayúsculas, como en msf.es */
  #botonFondo, #botonTxt { transition: fill .3s, stroke .3s; } /* el botón cambia de color suavemente */          /* las cifras cambian de color suavemente */
  .tip .num { display: block; font-size: 34px; font-weight: 500; color: #EE0000; line-height: 1; } /* cifra grande en rojo */
  /* Modo incrustado (?embed): dentro de la página del proyecto, sin fondo gris ni sombra */
  html.embed body { background: #fff; display: block; min-height: 0; margin: 0; }
  html.embed .pieza { width: 100%; }
  html.embed svg { box-shadow: none; }
</style>

<script>
// ---------- Ajustes de la perspectiva isométrica ----------
// En pantallas estrechas (móvil) la pieza pasa a una composición vertical
const MOVIL = window.innerWidth < 760;     // ¿pantalla estrecha?
const VBW = MOVIL ? 1000 : 1600;           // ancho del lienzo (viewBox)
const S = MOVIL ? 52 : 36;                 // tamaño de 1 unidad en píxeles
const CX = MOVIL ? 500 : 860;              // centro horizontal del dibujo
const CY = MOVIL ? 1130 : 575;             // centro vertical del dibujo
const NEGRO = "#000";    // contorno negro, como en sus pictogramas
const ROJO = "#EE0000";  // rojo MSF
const NS = "http://www.w3.org/2000/svg"; // espacio de nombres para crear elementos SVG
const W = 7, D = 5, H = 3;               // ancho, fondo y alto de la caja
const zB = 4.6, zS = 10.1;               // alturas finales de las dos capas (kit abierto)

// Textos de cada unidad de hospital (fuente: OMS, IEHK 2024)
const HOSP = [
  ["Oral", "Oral medicines for wards, outpatient departments or mobile clinics."],
  ["Injectables", "Injectable medicines for hospital wards."],
  ["Mental health", "Psychotropic medicines for specifically trained professionals."],
  ["Cold chain", "Medicines that must travel and be stored cold."],
  ["Prophylaxis (PEP)", "Preventive treatment after possible exposure to HIV."],
  ["Malaria", "Includes what is needed to prepare and give artesunate."],
  ["Controlled", "Medicines subject to special control."],
];

// Las 10 unidades básicas cuentan una consulta, paso a paso.
// Cada una lleva LO MISMO; cada cubo descubre una cosa de lo que hay dentro.
// Fuente: lista de la unidad básica IEHK (edición 2017), catálogo de la Cruz Roja.
const BASICA = [
  ["500",   "health cards", "Everyone who arrives gets their own card, kept in its own plastic bag."],
  ["5",     "digital thermometers", "The first question in any consultation: is there a fever?"],
  ["3,000", "paracetamol tablets", "To bring down fever and ease pain."],
  ["3,000", "amoxicillin tablets", "A basic antibiotic to treat infections."],
  ["200",   "sachets of oral rehydration salts", "One sachet in a litre of clean water treats dehydration caused by diarrhoea."],
  ["1,000", "zinc tablets", "Given with oral rehydration salts to children with diarrhoea."],
  ["200",   "albendazole tablets", "Against intestinal worms."],
  ["50",    "tubes of eye ointment", "Tetracycline to treat eye infections."],
  ["700",   "bandages and gauze", "200 bandages and 500 compresses to clean and cover wounds."],
  ["1",     "15-litre foldable water container", "For water. Plus soap and treatment guidelines in Spanish, English and French."],
];
const vistos = new Set(); // unidades básicas ya descubiertas

// Posición de cada unidad de hospital: fila de 4 y fila de 3 (la 2.ª desplazada para centrarla)
const posH = [];
for (const [fila, cols] of [[0, 4], [1, 3]]) for (let c = 0; c < cols; c++) posH.push([0.6 + c * 1.6 + fila * 0.8, 0.9 + fila * 1.7]);
// Posición de cada unidad básica: 2 filas × 5 columnas
const posB = [];
for (let f = 0; f < 2; f++) for (let c = 0; c < 5; c++) posB.push([0.35 + c * 1.35, 1.2 + f * 1.4]);

// Convierte un punto 3D (x, y, z) a un punto 2D de la pantalla
const iso = (x, y, z) => [CX + (x - y) * S * 0.866, CY + (x + y) * S * 0.5 - z * S]; // 0.866 = cos 30°

// Crea un polígono SVG a partir de puntos 3D
function cara(g, puntos, relleno, extra = {}) {
  const p = document.createElementNS(NS, "polygon");                          // nuevo polígono
  p.setAttribute("points", puntos.map(pt => iso(...pt).join(",")).join(" ")); // puntos en 2D
  p.setAttribute("fill", relleno);                                             // color
  p.setAttribute("stroke", NEGRO);                                             // contorno negro
  p.setAttribute("stroke-width", 2.5);                                         // grosor
  p.setAttribute("stroke-linejoin", "round");                                  // esquinas suaves
  for (const k in extra) p.setAttribute(k, extra[k]);                          // atributos extra
  g.appendChild(p);                                                            // lo añadimos
}

// Dibuja un cubo (sus 3 caras visibles) dentro de un grupo con un identificador
function cubo(g, x, y, z, w, d, h, col, id) {
  const c = document.createElementNS(NS, "g"); // grupo del cubo
  c.dataset.u = id;                            // id para saber qué unidad es al pasar el ratón
  cara(c, [[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]], col[0]); // arriba
  cara(c, [[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]], col[1]); // frontal izquierda
  cara(c, [[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]], col[2]); // frontal derecha
  g.appendChild(c);                            // añadimos el cubo
  return c;                                    // y lo devolvemos (para ponerle el número)
}

// Crea un texto SVG
function texto(g, x, y, contenido, tam, peso = 400, color = "#414141", ancla = "start") {
  const t = document.createElementNS(NS, "text");               // nuevo texto
  Object.entries({ x, y, "font-size": tam, "font-weight": peso, fill: color, "text-anchor": ancla })
    .forEach(([k, v]) => t.setAttribute(k, v));                  // sus atributos
  t.textContent = contenido;                                     // contenido
  g.appendChild(t);                                              // lo añadimos
  return t;                                                      // y lo devolvemos
}

// Solapa de la tapa: bisagra de a→b, se abre en dirección "dir" con ángulo th
function solapa(g, a, b, dir, largo, th, relleno) {
  const c = Math.cos(th), s = Math.sin(th);                            // giro de la solapa
  const v = [dir[0] * c * largo, dir[1] * c * largo, s * largo];       // vector de la solapa
  cara(g, [a, b, [b[0]+v[0], b[1]+v[1], b[2]+v[2]], [a[0]+v[0], a[1]+v[1], a[2]+v[2]]], relleno);
}

// ---------- Utilidades de animación ----------
const tramo = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));    // 0→1 dentro de un tramo
const suave = u => u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3) / 2;        // aceleración suave
const mezcla = (a, b, u) => a + (b - a) * u;                                 // interpolar

let T = 0;          // progreso actual (0 = cerrado, 1 = abierto)
let activo = null;  // unidad bajo el ratón, p. ej. "h3" o "b7"
const dib = document.getElementById("ilustracion"); // grupo del dibujo

// ---------- Dibuja toda la caja para un progreso t ----------
function dibujar(t) {
  dib.innerHTML = "";                                      // vaciamos el fotograma anterior
  const th = suave(tramo(t, 0, 0.3)) * 130 * Math.PI / 180; // ángulo de las solapas (0° → 130°)
  const abierta = th > Math.PI / 2;                         // ¿solapas ya por detrás?
  // Solapas: [bisagra inicio, bisagra fin, dirección al cerrar, largo, color]
  const sIzq = [[0,0,H],[0,D,H],[1,0],3.5,"#EDEDED"];  // izquierda (detrás)
  const sFon = [[0,0,H],[W,0,H],[0,1],2.5,"#EDEDED"];  // fondo (detrás)
  const sDer = [[W,0,H],[W,D,H],[-1,0],3.5,"#F5F5F5"]; // derecha (delante)
  const sFre = [[0,D,H],[W,D,H],[0,-1],2.5,"#FFFFFF"]; // frontal (delante)
  const pinta = s => solapa(dib, s[0], s[1], s[2], s[3], th, s[4]); // dibuja una solapa

  if (abierta) { pinta(sIzq); pinta(sFon); }                       // abiertas: las de atrás van primero
  cara(dib, [[0,0,0],[0,D,0],[0,D,H],[0,0,H]], "#E6E6E6");         // pared interior izquierda
  cara(dib, [[0,0,0],[W,0,0],[W,0,H],[0,0,H]], "#EDEDED");         // pared interior del fondo
  cara(dib, [[0,0,0],[W,0,0],[W,D,0],[0,D,0]], "#F5F5F5");         // suelo

  // Guías discontinuas (solo con el kit abierto)
  for (const [x, y] of [[0,0],[W,0],[0,D],[W,D]]) {
    const a = iso(x, y, H + 0.2), b = iso(x, y, 11.4);             // de la caja hacia arriba
    const l = document.createElementNS(NS, "line");                // línea
    Object.entries({ x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: "#9a9a9a", "stroke-width": 1.5,
      "stroke-dasharray": "4 6", opacity: tramo(t, 0.7, 1) }).forEach(([k, v]) => l.setAttribute(k, v));
    dib.appendChild(l);                                            // la añadimos
  }

  // Capa 1: 10 unidades básicas (rojas). Suben después que las de hospital (están debajo)
  posB.forEach(([x, y], i) => {
    const u = suave(tramo(t, 0.42 + i * 0.012, 0.8 + i * 0.012));  // cada una sale un poco después
    const on = activo === "b" + i, visto = vistos.has(i);           // ¿activa? ¿ya descubierta?
    const z = mezcla(0.05, zB, u) + (on ? 0.35 : 0);                // si está activa, sube un poco
    const col = on ? ["#000", "#222", "#111"]                       // activa = negra
              : visto ? ["#FFFFFF", "#B81B19", "#951512"]           // descubierta = tapa blanca ("abierta")
              : [ROJO, "#B81B19", "#951512"];                       // sin descubrir = roja
    const c = cubo(dib, x, y, z, 1, 1, 0.7, col, "b" + i);          // dibujamos la unidad
    const p = iso(x + 0.5, y + 0.5, z + 0.7);                       // centro de su tapa
    texto(c, p[0], p[1] + 5, i + 1, 14, 700, visto && !on ? ROJO : "#fff", "middle"); // su número de paso
  });

  // Capa 2: 7 unidades de hospital (blancas y numeradas). Salen primero
  posH.forEach(([x, y], i) => {
    const u = suave(tramo(t, 0.22 + i * 0.02, 0.62 + i * 0.02));    // escalonadas
    const z = mezcla(0.8, zS, u);                                   // de dentro de la caja a arriba
    const on = activo === "h" + i;                                  // ¿está activa?
    const c = cubo(dib, x, y, z, 1.2, 1.2, 1, on ? [ROJO, "#B81B19", "#951512"] : ["#FFFFFF", "#F0F0F0", "#DADADA"], "h" + i);
    const p = iso(x + 0.6, y + 0.6, z + 1);                         // centro de su cara de arriba
    texto(c, p[0], p[1] + 7, i + 1, 20, 700, on ? "#fff" : ROJO, "middle"); // su número
  });

  cara(dib, [[0,D,0],[W,D,0],[W,D,H],[0,D,H]], "#FFFFFF");         // pared frontal izquierda
  cara(dib, [[W,0,0],[W,D,0],[W,D,H],[W,0,H]], "#F5F5F5");         // pared frontal derecha


  if (!abierta) { pinta(sIzq); pinta(sDer); pinta(sFon); pinta(sFre); } // cerrada: la tapa tapa todo
  else { pinta(sDer); pinta(sFre); }                                     // abierta: solo las de delante

  // Contador de personas
  if (destino) document.getElementById("cifra").textContent = Math.round(10000 * suave(tramo(t, 0.55, 1))).toLocaleString("en-GB"); // al abrir, cuenta
  document.getElementById("etiquetas").setAttribute("opacity", tramo(t, 0.8, 1)); // etiquetas al final
}

// ---------- Etiquetas de la derecha (una sola vez) ----------
const eti = document.getElementById("etiquetas"); // grupo de etiquetas
const LX = 1190;                                    // columna de los textos
function conector(ancla, y) {                       // línea en codo: dibujo → texto
  const pl = document.createElementNS(NS, "polyline");
  pl.setAttribute("points", `${ancla[0]},${ancla[1]} ${LX-30},${ancla[1]} ${LX-30},${y} ${LX-14},${y}`);
  pl.setAttribute("fill", "none"); pl.setAttribute("stroke", NEGRO); pl.setAttribute("stroke-width", 1.5);
  eti.appendChild(pl);                              // la añadimos
  const pt = document.createElementNS(NS, "circle"); // puntito sobre el dibujo
  pt.setAttribute("cx", ancla[0]); pt.setAttribute("cy", ancla[1]); pt.setAttribute("r", 5);
  eti.appendChild(pt);                              // lo añadimos
}
let progreso;                                    // texto que cambia al explorar
if (!MOVIL) {
  // Hospital: título, subtítulo y lista de 7
  conector(iso(6.6, 1.5, zS + 0.5), 222);
  texto(eti, LX, 230, "7 hospital units", 26, 700, "#000");
  texto(eti, LX, 258, "Doctors and specialised staff", 18);
  HOSP.forEach(([nombre], i) => {
    const g = document.createElementNS(NS, "g");       // grupo del ítem
    g.setAttribute("class", "item");                    // clase para resaltarlo
    g.dataset.u = "h" + i;                              // enlazado con su cubo
    g.setAttribute("tabindex", "0");                    // se puede recorrer con el teclado
    texto(g, LX, 292 + i * 23, `${i + 1}  ${nombre}`, 18); // número + nombre
    eti.appendChild(g);                                 // lo añadimos
  });
  // Básicas
  conector(iso(6.75, 1.7, zB + 0.35), 522);
  texto(eti, LX, 530, "10 basic units", 26, 700, "#000");
  texto(eti, LX, 560, "Each one cares for 1,000 people.", 18);
  texto(eti, LX, 584, "Together, they care for 10,000.", 18, 700, "#000"); // en palabras sencillas: cuadra con el 10.000
  texto(eti, LX, 608, "Nurses and community health workers", 18);
  progreso = texto(eti, LX, 640, "Explore what each unit holds", 18, 700, ROJO); // cambia según lo descubierto
  // La caja
  conector(iso(W, 2, 1.25), 692); // punto en la pared derecha, a la misma altura que el texto → línea recta
  texto(eti, LX, 700, "The kit", 26, 700, "#000");
  texto(eti, LX, 730, "Prepared before the emergency,", 18);
  texto(eti, LX, 754, "stored and ready to go.", 18);
} else {
  // MÓVIL: las etiquetas van debajo de la caja, sin conectores.
  // Una muestra de color al lado de cada título la relaciona con el dibujo.
  const ML = 60;                                       // margen izquierdo
  const muestra = (y, relleno) => {                    // cuadrado de color
    const r = document.createElementNS(NS, "rect");
    Object.entries({ x: ML, y: y - 32, width: 34, height: 34, fill: relleno, stroke: NEGRO, "stroke-width": 3 })
      .forEach(([k, v]) => r.setAttribute(k, v));
    eti.appendChild(r);
  };
  // Hospital
  muestra(1530, "#FFFFFF");
  texto(eti, ML + 50, 1530, "7 hospital units", 44, 700, "#000");
  texto(eti, ML, 1578, "Doctors and specialised staff", 32);
  HOSP.forEach(([nombre], i) => {                      // lista en dos columnas (4 + 3)
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "item"); g.dataset.u = "h" + i; g.setAttribute("tabindex", "0");
    texto(g, ML + (i < 4 ? 0 : 440), 1634 + (i % 4) * 46, `${i + 1}  ${nombre}`, 32);
    eti.appendChild(g);
  });
  // Básicas
  muestra(1860, ROJO);
  texto(eti, ML + 50, 1860, "10 basic units", 44, 700, "#000");
  texto(eti, ML, 1908, "Each one cares for 1,000 people.", 32);
  texto(eti, ML, 1952, "Together, they care for 10,000.", 32, 700, "#000");
  texto(eti, ML, 1996, "Nurses and community health workers", 32);
  progreso = texto(eti, ML, 2046, "Explore what each unit holds", 32, 700, ROJO);
  // La caja
  muestra(2130, "#F5F5F5");
  texto(eti, ML + 50, 2130, "The kit", 44, 700, "#000");
  texto(eti, ML, 2178, "Prepared before the emergency,", 32);
  texto(eti, ML, 2220, "stored and ready to go.", 32);
}

// ---------- Interacción ----------
const svg = document.getElementById("svg");   // el SVG
const tip = document.getElementById("tip");   // el tooltip
function info(id) {                             // contenido del tooltip según la unidad
  const i = +id.slice(1);                        // número de unidad
  if (id[0] === "h") return `<b>${i + 1}. ${HOSP[i][0]}</b>${HOSP[i][1]}`; // hospital: nombre + qué es
  const [n, que, historia] = BASICA[i];          // básica: cifra, qué es, historia
  return `<span class="num">${n}</span><b>${que}</b>${historia}`; // la cifra grande y el texto
}
function contar() {                              // actualiza el progreso de la historia
  if (vistos.size === 10) {                      // ¡todas descubiertas!
    progreso.textContent = "This is what each of the 10 holds."; // el remate: deja claro que es el contenido de UNA unidad
  } else if (vistos.size) progreso.textContent = `${vistos.size} of 10 units explored`; // contador
}

function activar(id, x, y) {                   // resalta una unidad y muestra su tooltip
  if (T < 0.95) return;                         // solo con el kit abierto
  activo = id;                                  // guardamos cuál es
  document.querySelectorAll(".item").forEach(e => e.classList.toggle("activo", e.dataset.u === id)); // resalta en la lista
  if (id[0] === "b") { vistos.add(+id.slice(1)); contar(); } // básica: la marcamos como descubierta
  tip.innerHTML = info(id);                     // texto del tooltip
  const ancho = tip.offsetWidth, cont = svg.getBoundingClientRect().width; // ancho del tooltip y de la pieza
  tip.style.left = Math.min(Math.max(x, ancho / 2 + 6), cont - ancho / 2 - 6) + "px"; // sin salirse por los lados
  tip.style.top = y + "px";                     // encima del cubo
  tip.classList.add("visible");                 // lo enseñamos
  dibujar(T);                                   // redibujamos con el resaltado
}
function desactivar() {                         // quita el resaltado
  activo = null;
  document.querySelectorAll(".item").forEach(e => e.classList.remove("activo"));
  tip.classList.remove("visible");
  dibujar(T);
}
// Posición del tooltip encima de un cubo (convierte coordenadas del SVG a píxeles)
function sobreCubo(id) {
  const i = +id.slice(1), r = svg.getBoundingClientRect(), k = r.width / VBW; // escala real
  const p = id[0] === "h" ? iso(posH[i][0] + 0.6, posH[i][1] + 0.6, zS + 1) : iso(posB[i][0] + 0.5, posB[i][1] + 0.5, zB + 1.05);
  return [p[0] * k, p[1] * k];                  // en píxeles dentro de .pieza
}
// Ratón: cualquier cosa con data-u (cubos o ítems de la lista)
// (usamos pointermove porque el dibujo se rehace al resaltar y "pointerout" daría falsos avisos)
svg.addEventListener("pointermove", e => {
  const el = e.target.closest("[data-u]");      // ¿estamos sobre una unidad?
  const id = el ? el.dataset.u : null;           // su id, o nada
  if (id === activo) return;                     // misma unidad: no hacemos nada
  if (id) activar(id, ...sobreCubo(id));         // nueva unidad: resaltamos
  else if (activo) desactivar();                 // fuera de cualquier unidad: quitamos
});
svg.addEventListener("pointerleave", () => { if (activo) desactivar(); }); // el ratón sale de la pieza
// Toque (móvil y tablet): pulsar un cubo lo abre; pulsar fuera lo cierra
svg.addEventListener("click", e => {
  if (e.target.closest("#boton")) return;      // el botón va aparte
  const el = e.target.closest("[data-u]");      // ¿se ha pulsado una unidad?
  if (el) { if (el.dataset.u !== activo) activar(el.dataset.u, ...sobreCubo(el.dataset.u)); }
  else if (activo) desactivar();                 // pulsar fuera: quitamos
});
// Teclado: recorrer la lista con Tab
eti.addEventListener("focusin", e => { const el = e.target.closest("[data-u]"); if (el) activar(el.dataset.u, ...sobreCubo(el.dataset.u)); });
eti.addEventListener("focusout", desactivar);

// Abrir / cerrar con animación
let destino = 0, anim = null;                   // a dónde vamos y animación en curso
const reducir = matchMedia("(prefers-reduced-motion: reduce)").matches; // accesibilidad: sin animación
// Textos de cada estado: 1 = kit abierto (llega), 0 = kit cerrado (no llega)
const TXT = {
  1: { t1: "What fits", t2: "in a kit", e1: "An emergency health kit can provide care for",
       e2a: "10,000 people for 3 months.", e2b: "", e3: "See what's inside →",
       c1: "people with medical care", c3: "of medicines and supplies", c17: "from clinic to hospital" },
  0: { t1: "What's missing", t2: "without a kit", e1: "If the kit doesn't arrive, 10,000 people",
       e2a: "may be left without medical care.", e2b: "", e3: "",
       c1: "people without medical care", c3: "without medicines or supplies", c17: "that don't arrive" },
};
let modoTxt = 1; // qué textos se ven ahora
function textos(a) {
  if (a === modoTxt) return;                                  // ya están puestos
  modoTxt = a;                                                // guardamos el nuevo estado
  const els = document.querySelectorAll(".cambia");          // textos que cambian
  els.forEach(e => e.classList.add("fuera"));                 // 1) se desvanecen
  setTimeout(() => {
    for (const [id, v] of Object.entries(TXT[a])) document.getElementById(id).textContent = v; // 2) cambiamos el texto
    document.querySelectorAll(".num-c").forEach(n => n.style.fill = a ? ROJO : "#414141");     // cifras: rojo o gris (bajón)
    els.forEach(e => e.classList.remove("fuera"));            // 3) vuelven a aparecer
  }, 300);
}
function ir(a) {
  textos(a);                                    // cambia el mensaje (bajón al cerrar)
  destino = a;                                  // 1 = abrir, 0 = cerrar
  document.getElementById("botonTxt").textContent = a ? "Close the kit" : "Open the kit"; // texto del botón
  const fondo = document.getElementById("botonFondo");              // fondo del botón
  fondo.style.fill = a ? "#FFFFFF" : ROJO;                           // cerrar = blanco · abrir = rojo
  fondo.style.stroke = a ? "#000" : ROJO;                            // cerrar lleva borde negro
  document.getElementById("botonTxt").style.fill = a ? "#000" : "#fff"; // texto negro o blanco
  if (activo) desactivar();                     // quitamos resaltados
  if (reducir) { T = a; dibujar(T); return; }   // sin animación si el usuario lo prefiere
  cancelAnimationFrame(anim);                   // paramos la anterior
  let prev = performance.now();                 // tiempo del fotograma anterior
  const paso = ahora => {
    const dt = (ahora - prev) / 2200; prev = ahora;               // la animación completa dura 2,2 s
    T = destino ? Math.min(1, T + dt) : Math.max(0, T - dt * 1.6); // cerrar es un poco más rápido
    dibujar(T);                                                    // pintamos
    if (T !== destino) anim = requestAnimationFrame(paso);         // seguimos si no hemos llegado
  };
  anim = requestAnimationFrame(paso);           // arrancamos
}
const boton = document.getElementById("boton"); // el botón
boton.addEventListener("click", () => ir(destino ? 0 : 1)); // clic: alterna
boton.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ir(destino ? 0 : 1); } }); // teclado

if (MOVIL) {                                     // composición vertical para móvil
  svg.setAttribute("viewBox", "0 0 1000 2920");  // lienzo alto
  const pon = (id, a) => { const e = document.getElementById(id); for (const k in a) e.setAttribute(k, a[k]); };
  pon("t1", { x: 60, y: 150, "font-size": 88 });              // titular
  pon("t2", { x: 60, y: 242, "font-size": 88 });
  pon("e1", { x: 60, y: 340, "font-size": 36 });               // entradilla
  pon("e2", { x: 60, y: 388, "font-size": 36 });
  const logo = svg.querySelector("image");                     // logo arriba a la derecha
  logo.setAttribute("x", 700); logo.setAttribute("y", 70); logo.setAttribute("width", 240); logo.setAttribute("height", 78); // logo en inglés (más ancho)
  pon("botonFondo", { x: 60, y: 430, width: 300, height: 80, rx: 0 }); // botón más grande para el dedo
  pon("botonTxt", { x: 210, y: 479, "font-size": 24 });
  pon("e3", { x: 384, y: 480, "font-size": 30 });
  pon("linea", { x1: 60, y1: 2290, x2: 940, y2: 2290 });       // cifras, al final
  pon("cifra", { x: 60, y: 2430, "font-size": 150 });
  pon("c1", { x: 60, y: 2504, "font-size": 38 });
  pon("n3", { x: 60, y: 2620, "font-size": 110 });
  pon("lm", { x: 210, y: 2580, "font-size": 36 });
  pon("c3", { x: 210, y: 2620, "font-size": 32 });
  pon("n17", { x: 60, y: 2760, "font-size": 110 });
  pon("lu", { x: 210, y: 2720, "font-size": 36 });
  pon("c17", { x: 210, y: 2760, "font-size": 32 });
  const f = document.getElementById("fuente");                 // fuente en dos líneas
  f.textContent = ""; f.setAttribute("font-size", 22);
  [["Sources: WHO, Interagency Emergency Health Kit 2024 (MSF uses", 2830],
   ["its own version). Basic unit contents: 2017 edition.", 2860]].forEach(([t, y]) => {
    const ts = document.createElementNS(NS, "tspan"); ts.setAttribute("x", 60); ts.setAttribute("y", y); ts.textContent = t; f.appendChild(ts);
  });
  pon("firma", { x: 60, y: 2898, "font-size": 24 });
}
// Si se cruza el límite móvil/escritorio (girar la tablet, redimensionar), recargamos con la composición adecuada
matchMedia("(max-width: 759px)").addEventListener("change", () => location.reload());

dibujar(0);                       // empezamos con el kit cerrado
setTimeout(() => ir(1), 900);     // y se abre solo al cargar
</script>
